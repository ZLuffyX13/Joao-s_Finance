<div class="login-page">
	<section class="login-card" [attr.aria-label]="authMode === 'signIn' ? 'FinanceFlow sign in' : 'FinanceFlow create account'">
		<div class="login-panel">
			<div class="brand">
				<span class="brand-mark">Finance</span><span class="brand-accent">Flow</span>
			</div>

			<div class="mode-switch" role="tablist" aria-label="Authentication mode">
				<button
					type="button"
					class="mode-switch__item"
					[class.mode-switch__item--active]="authMode === 'signIn'"
					[attr.aria-selected]="authMode === 'signIn'"
					(click)="setAuthMode('signIn')"
				>
					Sign in
				</button>
				<button
					type="button"
					class="mode-switch__item"
					[class.mode-switch__item--active]="authMode === 'createAccount'"
					[attr.aria-selected]="authMode === 'createAccount'"
					(click)="setAuthMode('createAccount')"
				>
					Create account
				</button>
			</div>

			<ng-container *ngIf="authMode === 'signIn'; else createAccountView">
				<h1>Welcome back</h1>
				<p class="subtitle">Sign in to your account to continue</p>

				<form class="login-form">
					<label for="signin-email">Email</label>
					<div class="input-shell">
						<span class="input-icon" aria-hidden="true">&#64;</span>
						<input id="signin-email" type="email" placeholder="you@email.com" autocomplete="email" />
					</div>

					<label for="signin-password">Password</label>
					<div class="input-shell">
						<span class="input-icon" aria-hidden="true">*</span>
						<input id="signin-password" type="password" placeholder="Enter your password" autocomplete="current-password" />
					</div>

					<div class="form-meta">
						<label class="remember-me">
							<input type="checkbox" />
							<span>Keep me signed in for 30 days</span>
						</label>

						<a href="#" class="forgot-password">Forgot password?</a>
					</div>

					<button type="submit" class="submit-button">Sign in</button>
				</form>
			</ng-container>

			<ng-template #createAccountView>
				<h1>Create your account</h1>
				<p class="subtitle">Start managing your money smarter</p>

				<form class="login-form">
					<div class="split-fields">
						<div>
							<label for="first-name">First name</label>
							<div class="input-shell">
								<input id="first-name" type="text" placeholder="Alex" autocomplete="given-name" />
							</div>
						</div>

						<div>
							<label for="last-name">Last name</label>
							<div class="input-shell">
								<input id="last-name" type="text" placeholder="Johnson" autocomplete="family-name" />
							</div>
						</div>
					</div>

					<label for="signup-email">Email</label>
					<div class="input-shell">
						<span class="input-icon" aria-hidden="true">&#64;</span>
						<input id="signup-email" type="email" placeholder="you@email.com" autocomplete="email" />
					</div>

					<label for="signup-password">Password</label>
					<div class="input-shell">
						<span class="input-icon" aria-hidden="true">*</span>
						<input id="signup-password" type="password" placeholder="Create a strong password" autocomplete="new-password" />
					</div>

					<label for="confirm-password">Confirm password</label>
					<div class="input-shell">
						<span class="input-icon" aria-hidden="true">*</span>
						<input id="confirm-password" type="password" placeholder="Repeat your password" autocomplete="new-password" />
					</div>

					<p class="helper-text">Use at least 8 characters with a mix of letters and numbers.</p>

					<button type="submit" class="submit-button">Create free account</button>

					<p class="account-switch">
						Already have an account?
						<button type="button" class="text-button" (click)="setAuthMode('signIn')">Sign in</button>
					</p>
				</form>
			</ng-template>
		</div>

		<aside class="login-visual" aria-hidden="true">
			<div class="orb orb--one"></div>
			<div class="orb orb--two"></div>
			<div class="visual-card">
				<p class="visual-card__label">Secure access</p>
				<strong class="visual-card__value">Centralized finance</strong>
			</div>
		</aside>
	</section>
</div>
